name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Composed (not thin test-system.yml): consumer install of llama-cpp linux/amd64
# and windows/amd64 pulls the CUDA+Vulkan overlay (~1.7GB). chipz decompress
# OOMs default ~1GB SBCL heap. canned test-system.yml has no heap input yet.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    container: ${{ startsWith(matrix.os, 'ubuntu') && 'ghcr.io/egao1980/cl-repository/ci-base:latest' || fromJSON('null') }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
    env:
      SBCL_VERSION: "2.6.7"
      ROSWELL_VERSION: "26.02.116"
    steps:
      - uses: actions/checkout@v5

      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - name: SBCL heap for native overlays
        shell: bash
        run: |
          set -euo pipefail
          # ci-base: ros reads passwd home (/root); GHA remaps HOME. ros config
          # alone left ubuntu on a ~2GB heap and OOM'd the 1.7GB llama-cpp overlay.
          REAL_ROS="$(command -v ros)"
          mkdir -p "$HOME/.local/bin"
          printf '%s\n' '#!/bin/bash' "exec \"$REAL_ROS\" --dynamic-space-size 16384 \"\$@\"" \
            > "$HOME/.local/bin/ros"
          chmod +x "$HOME/.local/bin/ros"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: test
