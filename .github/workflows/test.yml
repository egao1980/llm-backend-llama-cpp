name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Composed (not thin test-system.yml): consumer install of llama-cpp linux/amd64
# pulls a 1.7GB CUDA+Vulkan gzip. scripts/ci/pre-install.lisp stream-extracts
# it. The ci action's later dynamic-space-size wins over a PATH ros wrapper,
# so the heap has to be this input (8192). macOS stays at 4096 (small layer,
# smaller runner).
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    container: ${{ startsWith(matrix.os, 'ubuntu') && 'ghcr.io/egao1980/cl-repository/ci-base:latest' || fromJSON('null') }}
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
    env:
      SBCL_VERSION: "2.6.7"
      ROSWELL_VERSION: "26.02.116"
    steps:
      - uses: actions/checkout@v5

      - uses: egao1980/cl-repository/.github/actions/setup-lisp@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install
          sbcl-dynamic-space-mb: ${{ startsWith(matrix.os, 'macos') && '4096' || '8192' }}

      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: test
          sbcl-dynamic-space-mb: ${{ startsWith(matrix.os, 'macos') && '4096' || '8192' }}
